<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada | Braseiro do Grajaú</title>
  <meta name="description" content="Página não encontrada no Braseiro do Grajaú. Volte para conferir nosso cardápio de carnes na brasa e chope gelado no Grajaú.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0e0a08">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  
  <link rel="stylesheet" href="css/global.css?v=22">
  <link rel="stylesheet" href="css/navbar.css?v=22">
  <link rel="stylesheet" href="css/sections.css?v=22">
  <link rel="stylesheet" href="css/footer.css?v=22">

  <style>
    .not-found-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem 1.5rem;
      background: radial-gradient(circle at center, #1e130d 0%, #0e0a08 70%);
      position: relative;
      overflow: hidden;
    }
    .not-found-content {
      max-width: 600px;
      z-index: 2;
    }
    .not-found-code {
      font-family: var(--font-display);
      font-size: clamp(5rem, 15vw, 8.5rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--color-gold) 0%, var(--color-amber) 50%, var(--color-wine) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
      text-shadow: 0 10px 30px rgba(212, 146, 31, 0.2);
    }
    .not-found-icon {
      font-size: 3rem;
      color: var(--color-amber);
      margin-bottom: 1.5rem;
      animation: flamePulse 2.5s infinite ease-in-out;
    }
    .not-found-title {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      color: var(--color-cream);
      margin-bottom: 1rem;
    }
    .not-found-desc {
      color: var(--color-text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .not-found-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    @keyframes flamePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(212, 146, 31, 0.4)); }
      50% { transform: scale(1.12); filter: drop-shadow(0 0 20px rgba(232, 168, 42, 0.8)); }
    }
  </style>
</head>
<body>
  <main class="not-found-page">
    <div class="not-found-content">
      <div class="not-found-icon"><i class="fas fa-fire"></i></div>
      <div class="not-found-code">404</div>
      <h1 class="not-found-title">Essa brasa não acendeu!</h1>
      <p class="not-found-desc">A página que você está procurando não existe ou mudou de lugar. Mas não se preocupe: a brasa continua quente e o chope trincando no nosso salão!</p>
      <div class="not-found-actions">
        <a href="index.html" class="btn btn--primary btn--lg">
          <i class="fas fa-home"></i> Página Inicial
        </a>
        <a href="index.html#cardapio" class="btn btn--ghost btn--lg">
          <i class="fas fa-utensils"></i> Ver Cardápio
        </a>
      </div>
    </div>
  </main>
</body>
</html>
